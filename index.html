<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route Conference Rooms</title>
<meta name="description" content="Screensavers for the Route conference room displays.">
<meta name="theme-color" content="#1a1618">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 517.222 517.222'%3E%3Crect width='517.222' height='517.222' rx='60' fill='%231A1618'/%3E%3Cpath fill='%239CF5F5' d='M221.927 186.465C240.599 167.722 270.9 167.722 289.571 186.465L398.692 295.961L364.03 330.758C345.358 349.501 315.057 349.501 296.386 330.758L221.2 255.282C219.883 253.96 218.475 252.728 217.021 251.588C210.797 246.161 203.801 241.692 196.124 238.5C189.445 235.718 182.54 233.939 175.453 233.119L221.927 186.465Z M122.21 327.968C124.663 333.805 128.207 339.096 132.659 343.565L200.257 275.705C195.805 271.191 190.536 267.633 184.721 265.216C178.951 262.799 172.727 261.522 166.413 261.522C160.098 261.522 153.874 262.754 148.059 265.171C142.244 267.542 136.975 271.099 132.522 275.569C128.116 280.038 124.572 285.328 122.165 291.165C119.757 297.003 118.53 303.251 118.53 309.59C118.53 315.929 119.802 322.176 122.21 327.968Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script>
  // Set the theme before first paint. Order: ?theme= > saved choice > dark.
  // (Deliberately ignores the OS setting: the TVs should always start dark.)
  (() => {
    let t = new URLSearchParams(location.search).get("theme");
    if (t !== "light" && t !== "dark") { try { t = localStorage.getItem("rcr-theme"); } catch (e) { t = null; } }
    document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
  })();
</script>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="nogl" hidden>This screensaver needs WebGL, which isn't available in this browser.</div>

<div id="hint" aria-hidden="true">Press any key or click for controls</div>

<div id="panel" role="group" aria-label="Screensaver controls">
  <div id="picker" class="row" role="group" aria-label="Choose screensaver"></div>
  <div class="row">
    <button id="bTheme" type="button" aria-label="Toggle light and dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Light</span>
    </button>
    <button id="bFull" type="button" aria-label="Toggle full screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span id="fullLabel">Full screen</span>
    </button>
    <button id="bPause" type="button" aria-label="Pause or resume">
      <span id="pauseLabel">Pause</span>
    </button>
  </div>
  <label>Speed <input id="rSpeed" type="range" min="0.25" max="4" step="0.05" value="1"><output id="oSpeed">1.0×</output></label>
  <div id="extra"></div>
  <p id="status" role="status" aria-live="off"></p>
  <p class="keys"><kbd>1</kbd><kbd>2</kbd> screensaver · <kbd>T</kbd> theme · <kbd>F</kbd> full screen · <kbd>↑↓</kbd> speed · <kbd>Space</kbd> pause · <kbd>H</kbd> hide controls</p>
</div>

<script src="js/savers/registry.js"></script>
<script src="js/savers/starfield.js"></script>
<script src="js/savers/cornerhunter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
